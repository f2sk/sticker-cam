<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>sticker-cam</title>
    <style>
        :root { --app-height: 100vh; }

        html, body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0; padding: 0; overflow: hidden;
            background: #000; color: white;
            display: flex; flex-direction: column;
            height: var(--app-height);
        }

        #viewport {
            flex: 1; position: relative; width: 100%;
            background: #111; overflow: hidden; z-index: 1;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* 既存写真モード用の背景画像 */
        #bg-img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: contain;
            display: none; z-index: 5; background: #111;
        }
        /* カメラ復帰ボタン（写真モード時のみ表示） */
        #bg-close {
            position: absolute; top: 12px; left: 12px; z-index: 20;
            width: 40px; height: 40px; line-height: 40px; flex: none;
            border-radius: 50%; background: rgba(0,0,0,0.55);
            border: 1px solid #555; color: #fff; font-size: 16px;
            padding: 0; display: none;
        }

        #frame-layer {
            position: absolute; top: 0; left: 0;
            will-change: transform; touch-action: none;
            z-index: 10; display: none; transform-origin: 0 0;
        }
        #frame-img {
            display: block; pointer-events: none;
            transform-origin: center center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* フレームモード: 固定フレーム枠（この矩形にクリップして中身写真を収める） */
        #frame-view {
            position: absolute; overflow: hidden;
            display: none; z-index: 8;
        }
        #photo-layer {
            position: absolute; top: 0; left: 0;
            will-change: transform; touch-action: none;
            transform-origin: 0 0;
        }
        #photo-inner {
            display: block; pointer-events: none;
            transform-origin: center center;
        }
        /* 最前面の固定フレームPNG（枠いっぱい・タッチは透過させる） */
        #frame-fixed {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none;
        }

        /* モード切替トグル（ビューポート上部中央に浮かせる） */
        #mode-toggle {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; gap: 0;
            background: rgba(0,0,0,0.5); border: 1px solid #555;
            border-radius: 12px; overflow: hidden;
        }
        .mode-btn {
            background: none; border: none; color: #aaa; font-size: 12px;
            font-weight: bold; height: 32px; line-height: 32px;
            padding: 0 14px; flex: none; border-radius: 0; cursor: pointer;
        }
        .mode-btn.active { background: #007bff; color: #fff; }

        /* ステッカーパネル */
        #sticker-panel {
            background: #1a1a1a; border-top: 1px solid #333;
            display: none; flex-direction: column; z-index: 100;
        }
        #sticker-panel.has-items { display: flex; }

        .sticker-tabs {
            display: flex; padding: 6px 12px 0; gap: 4px;
        }
        .sticker-tab {
            background: none; border: none; color: #888; font-size: 12px;
            font-weight: bold; padding: 4px 10px; border-radius: 8px 8px 0 0;
            height: auto; line-height: normal; flex: none; cursor: pointer;
        }
        .sticker-tab.active { color: #fff; background: #333; }

        .sticker-list {
            display: flex; gap: 8px; padding: 8px 12px 10px;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .sticker-list::-webkit-scrollbar { display: none; }

        .sticker-item {
            position: relative; flex-shrink: 0;
            width: 64px; height: 64px; border-radius: 10px;
            background: #333; overflow: hidden; cursor: pointer;
            border: 2px solid transparent;
        }
        .sticker-item:active { border-color: #007bff; }
        .sticker-item img {
            width: 100%; height: 100%; object-fit: contain;
            pointer-events: none;
        }
        .sticker-fav {
            position: absolute; top: 2px; right: 2px;
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: none; color: #888;
            font-size: 12px; line-height: 22px; text-align: center;
            padding: 0; cursor: pointer; flex: none;
            height: 22px;
        }
        .sticker-fav.faved { color: #f1c40f; }
        .sticker-del {
            position: absolute; bottom: 2px; right: 2px;
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: none; color: #666;
            font-size: 12px; line-height: 22px; text-align: center;
            padding: 0; cursor: pointer; flex: none;
            height: 22px; display: none;
        }
        .sticker-item:hover .sticker-del,
        .sticker-item:active .sticker-del { display: block; }

        /* 操作パネル */
        .controls {
            height: 160px; background: #1a1a1a;
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 20px calc(env(safe-area-inset-bottom) / 2);
            z-index: 100; border-top: 1px solid #333;
        }

        .button-group { display: flex; gap: 10px; height: 60px; align-items: center; }

        button, label {
            display: block; background: #333; color: white; border: 1px solid #555;
            border-radius: 14px; font-size: 14px; font-weight: bold;
            height: 54px; line-height: 54px; cursor: pointer; flex: 1; text-align: center;
        }
        #shutter { background: #e74c3c; border: none; flex: 1.5; }

        #exposure-ui { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; height: 30px; visibility: hidden; }
        input[type="range"] { flex: 1; accent-color: #f1c40f; }
        input[type="file"] { display: none; }

        canvas { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline></video>
    <img id="bg-img" src="" alt="">
    <button id="bg-close">✕</button>

    <!-- ステッカーモード: 背景の上に貼る可動PNG -->
    <div id="frame-layer"><img id="frame-img" src=""></div>

    <!-- フレームモード: 固定フレーム枠の中に可動写真を収める -->
    <div id="frame-view">
        <div id="photo-layer"><img id="photo-inner" src=""></div>
        <img id="frame-fixed" src="">
    </div>

    <div id="mode-toggle">
        <button class="mode-btn active" data-layout="sticker">ステッカー</button>
        <button class="mode-btn" data-layout="frame">フレーム</button>
    </div>
</div>

<div id="sticker-panel">
    <div class="sticker-tabs">
        <button class="sticker-tab active" data-tab="recent">最近</button>
        <button class="sticker-tab" data-tab="favs">お気に入り</button>
    </div>
    <div class="sticker-list" id="sticker-list"></div>
</div>

<div class="controls">
    <div id="exposure-ui">
        <span style="font-size:10px; color:#aaa;">BRIGHTNESS</span>
        <input type="range" id="exposure-slider" step="0.1">
    </div>
    <div class="button-group">
        <label for="photo-input">写真</label>
        <!-- accept指定はAndroidでフォトピッカー(Googleフォト)に絞られローカルが選べないため付けない。画像判定はJS側で行う -->
        <input type="file" id="photo-input">
        <label for="file-input">PNG選択</label>
        <!-- accept指定はAndroidでローカルが選べなくなるため付けない。PNG判定はJS側で行う -->
        <input type="file" id="file-input">
        <button id="shutter">撮影(JPG)</button>
    </div>
</div>

<canvas id="canvas-output"></canvas>

<script>
    function lockHeight() {
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        // フレームモードで枠表示中なら、新しいビューポートサイズに合わせ直す
        // （初回呼び出し時は let 変数が未初期化なので DOM 表示状態で判定）
        const fv = document.getElementById('frame-view');
        if (fv && fv.style.display === 'block') {
            fitFrame();
            updateTransform();
        }
    }
    window.addEventListener('resize', lockHeight);
    lockHeight();

    const video = document.getElementById('video');
    const frameLayer = document.getElementById('frame-layer');
    const frameImg = document.getElementById('frame-img');
    const exposureUI = document.getElementById('exposure-ui');
    const exposureSlider = document.getElementById('exposure-slider');
    const canvas = document.getElementById('canvas-output');
    const viewport = document.getElementById('viewport');
    const bgImg = document.getElementById('bg-img');
    const bgClose = document.getElementById('bg-close');
    const shutterBtn = document.getElementById('shutter');
    const frameView = document.getElementById('frame-view');
    const photoLayer = document.getElementById('photo-layer');
    const photoInner = document.getElementById('photo-inner');
    const frameFixed = document.getElementById('frame-fixed');

    let videoTrack = null;
    let mode = 'camera';           // 背景ソース: 'camera' | 'photo'（ステッカーモード用）
    let layout = 'sticker';        // レイアウト: 'sticker'（背景＋可動PNG） | 'frame'（固定枠＋可動写真）
    let exposureAvailable = false; // 露出補正UIの有無（カメラ復帰時の復元用）
    let currentRotation = 0;
    // ステッカーモード: 可動PNG(frame-layer)の変形状態
    let stickerState = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };
    // フレームモード: 可動写真(photo-layer)の変形状態（座標はframe-view内ローカル）
    let photoState = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };

    // 現在アクティブな可動レイヤーとその状態・ヒット判定セレクタ
    function getActive() {
        if (layout === 'frame') return { st: photoState, hit: '#photo-layer' };
        return { st: stickerState, hit: '#frame-layer' };
    }

    // === IndexedDB ステッカーストレージ ===
    const DB_NAME = 'sticker-cam';
    const DB_VER = 1;
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VER);
            req.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains('stickers')) {
                    const store = d.createObjectStore('stickers', { keyPath: 'id' });
                    store.createIndex('usedAt', 'usedAt');
                }
            };
            req.onsuccess = (e) => { db = e.target.result; resolve(db); };
            req.onerror = (e) => reject(e);
        });
    }

    function makeThumbnail(dataUrl, maxSize) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                const ratio = Math.min(maxSize / img.width, maxSize / img.height, 1);
                c.width = img.width * ratio;
                c.height = img.height * ratio;
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/png'));
            };
            img.src = dataUrl;
        });
    }

    async function saveSticker(dataUrl) {
        const thumb = await makeThumbnail(dataUrl, 128);
        const id = 's_' + Date.now();
        const record = { id, data: dataUrl, thumb, fav: false, usedAt: Date.now() };
        return new Promise((resolve, reject) => {
            const tx = db.transaction('stickers', 'readwrite');
            tx.objectStore('stickers').put(record);
            tx.oncomplete = () => { trimOldStickers(); resolve(record); };
            tx.onerror = (e) => reject(e);
        });
    }

    function updateSticker(record) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction('stickers', 'readwrite');
            tx.objectStore('stickers').put(record);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e);
        });
    }

    function deleteSticker(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction('stickers', 'readwrite');
            tx.objectStore('stickers').delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e);
        });
    }

    function getAllStickers() {
        return new Promise((resolve, reject) => {
            const tx = db.transaction('stickers', 'readonly');
            const req = tx.objectStore('stickers').getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = (e) => reject(e);
        });
    }

    async function trimOldStickers() {
        const all = await getAllStickers();
        const nonFav = all.filter(s => !s.fav).sort((a, b) => b.usedAt - a.usedAt);
        const MAX_RECENT = 20;
        if (nonFav.length > MAX_RECENT) {
            const toDelete = nonFav.slice(MAX_RECENT);
            for (const s of toDelete) await deleteSticker(s.id);
        }
    }

    // === ステッカーパネルUI ===
    const stickerPanel = document.getElementById('sticker-panel');
    const stickerList = document.getElementById('sticker-list');
    let currentTab = 'recent';

    document.querySelectorAll('.sticker-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            currentTab = tab.dataset.tab;
            document.querySelectorAll('.sticker-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderStickerList();
        });
    });

    async function renderStickerList() {
        const all = await getAllStickers();
        let items;
        if (currentTab === 'favs') {
            items = all.filter(s => s.fav).sort((a, b) => b.usedAt - a.usedAt);
        } else {
            items = all.sort((a, b) => b.usedAt - a.usedAt);
        }

        stickerPanel.classList.toggle('has-items', all.length > 0);
        stickerList.innerHTML = '';

        items.forEach(s => {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.innerHTML = `<img src="${s.thumb}">` +
                `<button class="sticker-fav ${s.fav ? 'faved' : ''}">★</button>` +
                `<button class="sticker-del">✕</button>`;

            div.addEventListener('click', (e) => {
                if (e.target.closest('.sticker-fav') || e.target.closest('.sticker-del')) return;
                loadStickerFromDB(s);
            });

            div.querySelector('.sticker-fav').addEventListener('click', async (e) => {
                e.stopPropagation();
                s.fav = !s.fav;
                await updateSticker(s);
                renderStickerList();
            });

            div.querySelector('.sticker-del').addEventListener('click', async (e) => {
                e.stopPropagation();
                await deleteSticker(s.id);
                renderStickerList();
            });

            stickerList.appendChild(div);
        });
    }

    function loadStickerFromDB(record) {
        if (layout === 'frame') {
            // フレームモード: 選んだPNGを固定フレームとして読み込む
            frameFixed.onload = () => {
                frameView.style.display = 'block';
                fitFrame();
                if (photoInner.src) placePhotoInFrame();
                updateTransform();
            };
            frameFixed.src = record.data;
        } else {
            frameImg.src = record.data;
            frameImg.onload = () => {
                const vW = viewport.clientWidth;
                const vH = viewport.clientHeight;
                stickerState.scale = (vW * 0.7) / frameImg.naturalWidth;
                stickerState.x = (vW - (frameImg.naturalWidth * stickerState.scale)) / 2;
                stickerState.y = (vH - (frameImg.naturalHeight * stickerState.scale)) / 2;
                frameLayer.style.display = 'block';
                updateTransform();
            };
        }
        record.usedAt = Date.now();
        updateSticker(record);
    }

    // === カメラ起動 ===
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];

            const caps = videoTrack.getCapabilities();
            if (caps.exposureCompensation) {
                exposureAvailable = true;
                if (mode === 'camera') exposureUI.style.visibility = 'visible';
                exposureSlider.min = caps.exposureCompensation.min;
                exposureSlider.max = caps.exposureCompensation.max;
                exposureSlider.value = 0;
            }
        } catch (err) { console.error("Camera Access Denied:", err); }
    }

    // === PNG読み込み → DB保存 & 配置 ===
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type !== 'image/png') {
            alert('透過PNGファイルを選んでください');
            e.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const dataUrl = ev.target.result;
            if (layout === 'frame') {
                // フレームモード: 固定フレームPNGとして読み込む
                frameFixed.onload = () => {
                    frameView.style.display = 'block';
                    fitFrame();
                    if (photoInner.src) placePhotoInFrame();
                    updateTransform();
                };
                frameFixed.src = dataUrl;
            } else {
                frameImg.src = dataUrl;
                frameImg.onload = () => {
                    const vW = viewport.clientWidth;
                    const vH = viewport.clientHeight;
                    stickerState.scale = (vW * 0.7) / frameImg.naturalWidth;
                    stickerState.x = (vW - (frameImg.naturalWidth * stickerState.scale)) / 2;
                    stickerState.y = (vH - (frameImg.naturalHeight * stickerState.scale)) / 2;
                    frameLayer.style.display = 'block';
                    updateTransform();
                };
            }
            await saveSticker(dataUrl);
            renderStickerList();
        };
        reader.readAsDataURL(file);
        e.target.value = ''; // 同じファイルを続けて選べるようリセット
    });

    // === 既存写真を背景として読み込む（写真モード） ===
    document.getElementById('photo-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('画像ファイルを選んでください');
            e.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            if (layout === 'frame') {
                // フレームモード: フレーム枠の中に収める写真として読み込む
                photoInner.onload = () => {
                    if (frameFixed.naturalWidth) placePhotoInFrame();
                    photoLayer.style.display = 'block';
                    updateTransform();
                };
                photoInner.src = ev.target.result;
            } else {
                // ステッカーモード: 背景写真として読み込む
                bgImg.onload = () => {
                    mode = 'photo';
                    bgImg.style.display = 'block';
                    bgClose.style.display = 'block';
                    video.style.display = 'none';
                    exposureUI.style.visibility = 'hidden';
                    shutterBtn.textContent = '保存(JPG)';
                };
                bgImg.src = ev.target.result;
            }
        };
        reader.readAsDataURL(file);
        e.target.value = ''; // 同じファイルを続けて選べるようリセット
    });

    // === カメラモードへ復帰 ===
    bgClose.addEventListener('click', () => {
        mode = 'camera';
        bgImg.style.display = 'none';
        bgClose.style.display = 'none';
        video.style.display = 'block';
        shutterBtn.textContent = '撮影(JPG)';
        if (exposureAvailable) exposureUI.style.visibility = 'visible';
    });

    // === フレームモード用ヘルパ ===
    // 固定フレーム枠をビューポートにフィット（contain）させて配置。
    // 既に写真を配置済みなら、枠サイズ変化に合わせて比例スケールする。
    function fitFrame() {
        if (!frameFixed.naturalWidth) return;
        const vW = viewport.clientWidth, vH = viewport.clientHeight;
        const iw = frameFixed.naturalWidth, ih = frameFixed.naturalHeight;
        const scale = Math.min(vW / iw, vH / ih);
        const newW = iw * scale, newH = ih * scale;
        const oldW = frameView.clientWidth;
        frameView.style.left = ((vW - newW) / 2) + 'px';
        frameView.style.top = ((vH - newH) / 2) + 'px';
        frameView.style.width = newW + 'px';
        frameView.style.height = newH + 'px';
        if (photoInner.src && oldW > 0) {
            const r = newW / oldW;
            photoState.x *= r; photoState.y *= r; photoState.scale *= r;
        }
    }

    // 中身の写真をフレーム枠いっぱいに初期配置（cover=隙間なく埋める）
    function placePhotoInFrame() {
        const fw = frameView.clientWidth, fh = frameView.clientHeight;
        const pw = photoInner.naturalWidth, ph = photoInner.naturalHeight;
        if (!pw || !ph || !fw || !fh) return;
        const scale = Math.max(fw / pw, fh / ph);
        photoState.scale = scale;
        photoState.x = (fw - pw * scale) / 2;
        photoState.y = (fh - ph * scale) / 2;
    }

    // === モード切替 ===
    function setLayout(newLayout) {
        layout = newLayout;
        document.querySelectorAll('.mode-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.layout === layout));

        if (layout === 'frame') {
            // フレームモード: ステッカー用と背景ソースを隠し、固定枠を表示
            frameLayer.style.display = 'none';
            video.style.display = 'none';
            bgImg.style.display = 'none';
            bgClose.style.display = 'none';
            exposureUI.style.visibility = 'hidden';
            frameView.style.display = frameFixed.src ? 'block' : 'none';
            photoLayer.style.display = photoInner.src ? 'block' : 'none';
            shutterBtn.textContent = '保存(PNG)';
            fitFrame();
        } else {
            // ステッカーモード: フレーム枠を隠し、背景ソースを復帰
            frameView.style.display = 'none';
            frameLayer.style.display = frameImg.src ? 'block' : 'none';
            if (mode === 'photo') {
                bgImg.style.display = 'block';
                bgClose.style.display = 'block';
                shutterBtn.textContent = '保存(JPG)';
            } else {
                video.style.display = 'block';
                shutterBtn.textContent = '撮影(JPG)';
                if (exposureAvailable) exposureUI.style.visibility = 'visible';
            }
        }
        updateTransform();
    }

    document.querySelectorAll('.mode-btn').forEach(b => {
        b.addEventListener('click', () => setLayout(b.dataset.layout));
    });

    // === 回転制御 ===
    function handleOrientation() {
        const orient = window.orientation || 0;
        currentRotation = -orient;
        updateTransform();
    }
    window.addEventListener("orientationchange", handleOrientation);

    // === タッチ操作（アクティブな可動レイヤーを対象にする） ===
    viewport.addEventListener('touchstart', (e) => {
        const a = getActive();
        if (!e.target.closest(a.hit)) return;
        const st = a.st;
        if (e.touches.length === 1) {
            st.lastX = e.touches[0].clientX - st.x;
            st.lastY = e.touches[0].clientY - st.y;
        } else if (e.touches.length === 2) {
            st.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    viewport.addEventListener('touchmove', (e) => {
        const a = getActive();
        if (!e.target.closest(a.hit)) return;
        e.preventDefault();
        const st = a.st;
        if (e.touches.length === 1) {
            st.x = e.touches[0].clientX - st.lastX;
            st.y = e.touches[0].clientY - st.lastY;
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            st.scale *= (dist / st.lastDist);
            st.lastDist = dist;
        }
        updateTransform();
    }, { passive: false });

    function updateTransform() {
        if (layout === 'frame') {
            photoInner.style.transform = `rotate(${currentRotation}deg)`;
            photoLayer.style.transform = `translate(${photoState.x}px, ${photoState.y}px) scale(${photoState.scale})`;
        } else {
            frameImg.style.transform = `rotate(${currentRotation}deg)`;
            frameLayer.style.transform = `translate(${stickerState.x}px, ${stickerState.y}px) scale(${stickerState.scale})`;
        }
    }

    exposureSlider.addEventListener('input', (e) => {
        if (videoTrack) videoTrack.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(e.target.value) }] });
    });

    // === 撮影 & 合成 ===
    shutterBtn.addEventListener('click', () => {
        const ctx = canvas.getContext('2d');

        // --- フレームモード: 固定フレーム(実寸)の中に可動写真を収めて書き出す ---
        if (layout === 'frame') {
            if (!frameFixed.naturalWidth) return;
            canvas.width = frameFixed.naturalWidth;
            canvas.height = frameFixed.naturalHeight;
            // 画面上のフレーム枠px → 出力ピクセルへの倍率（= 1/フィット縮尺）
            const k = canvas.width / frameView.clientWidth;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (photoInner.src && photoLayer.style.display !== 'none') {
                const pw = photoInner.naturalWidth, ph = photoInner.naturalHeight;
                const drawW = pw * photoState.scale * k;
                const drawH = ph * photoState.scale * k;
                const cx = (photoState.x + pw * photoState.scale / 2) * k;
                const cy = (photoState.y + ph * photoState.scale / 2) * k;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(currentRotation * Math.PI / 180);
                ctx.drawImage(photoInner, -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();
            }
            // フレームを最前面に重ねる（透過部から写真が覗く）
            ctx.drawImage(frameFixed, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = `frame_${Date.now()}.png`; // 透過保持のためPNG
            link.href = canvas.toDataURL('image/png');
            link.click();
            return;
        }

        // 合成元をモードに応じて切替（カメラ映像 or 既存写真）
        const srcEl = mode === 'photo' ? bgImg : video;
        const natW = mode === 'photo' ? bgImg.naturalWidth : video.videoWidth;
        const natH = mode === 'photo' ? bgImg.naturalHeight : video.videoHeight;
        if (!natW || !natH) return;

        canvas.width = natW;
        canvas.height = natH;

        const vW = srcEl.offsetWidth;
        const vH = srcEl.offsetHeight;
        const rect = srcEl.getBoundingClientRect();
        const srcRatio = canvas.width / canvas.height;
        const elementRatio = vW / vH;
        let realW, realH, realX, realY;

        if (elementRatio > srcRatio) {
            realH = vH; realW = vH * srcRatio;
        } else {
            realW = vW; realH = vW / srcRatio;
        }
        realX = rect.left + (vW - realW) / 2;
        realY = rect.top + (vH - realH) / 2;

        const s = canvas.width / realW;

        ctx.drawImage(srcEl, 0, 0, canvas.width, canvas.height);

        if (frameImg.src && frameLayer.style.display !== 'none') {
            ctx.save();
            const drawW = (frameImg.naturalWidth * stickerState.scale) * s;
            const drawH = (frameImg.naturalHeight * stickerState.scale) * s;
            const centerX = (stickerState.x - realX) * s + drawW / 2;
            const centerY = (stickerState.y - realY) * s + drawH / 2;

            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation * Math.PI / 180);
            ctx.drawImage(frameImg, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
        }

        const link = document.createElement('a');
        link.download = `cam_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    });

    window.onload = async () => {
        await openDB();
        renderStickerList();
        startCamera();
        handleOrientation();
    };
</script>
</body>
</html>
